name: Build Fabric Mod

'on':
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Gradle project and build
        run: |
          PROJECT=$(find . -name gradlew -type f | head -n 1)

          if [ -z "$PROJECT" ]; then
            PROJECT=$(find . -name build.gradle -type f | head -n 1)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Gradle project found."
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          cd "$DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-Mod-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
